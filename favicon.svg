<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E08A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Tech circuit nodes -->
  <circle cx="14" cy="14" r="2.5" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="50" cy="50" r="2.5" fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M14 14 L22 22" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M50 50 L42 42" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- TS Monogram -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">TS</text>
</svg>
